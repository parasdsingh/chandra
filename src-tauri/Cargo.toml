[package]
name = "chandra"
description = "Moon phases and navagraha transits in the macOS menu bar."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[lib]
# Named separately from the binary so the crate can also be built as a library
# for integration tests without producing two identically named artifacts.
name = "chandra_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chandra-almanac = { workspace = true }
chandra-ephemeris = { workspace = true }
chandra-geo = { workspace = true }
chandra-glyph = { workspace = true }

tauri = { version = "2", features = [
    "tray-icon",
    "image-png",
    # `WebviewWindowBuilder::transparent` is `#[cfg(any(not(target_os =
    # "macos"), feature = "macos-private-api"))]` in tauri 2.11 - so on macOS
    # the method does not exist without this feature, and `panel.rs` calls it.
    # Removing the feature is a compile error, not a change in appearance.
    #
    # It is the transparency that needs it, not the vibrancy: `window-vibrancy`
    # is public AppKit. The panel is transparent so the material shows through
    # the scrim the panel paints over it (D-011), and so the window's corners
    # are the panel's own rounded corners rather than a square frame behind
    # them. There is no drop shadow - the window is built `.shadow(false)`.
    "macos-private-api",
] }

serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
jiff = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
# NSVisualEffectView, so the panel uses the same translucent material as the
# system's own menu bar popovers instead of a flat colour that sits oddly
# beside them.
window-vibrancy = "0.6"

# CoreLocation is reached directly rather than through tauri-plugin-geolocation:
# that plugin's desktop implementation returns Position::default(), which is
# latitude 0, longitude 0, with no error. Silently placing every user in the
# Gulf of Guinea is precisely the failure this app must not have.
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-core-location = { version = "0.3", features = [
    "CLLocationManager",
    "CLLocationManagerDelegate",
    "CLLocation",
] }
